<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SPMB - Cek Kelulusan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 20s infinite;
        }

        .bg-animation span:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-animation span:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .bg-animation span:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(20px, 30px) scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 45px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .container:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-wrapper {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .logo-wrapper img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            display: block;
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading p {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 15px;
            font-size: 14px;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            backdrop-filter: blur(10px);
        }

        .result-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
        }

        .result-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }

        .result-success .result-title {
            color: #4ade80;
        }

        .result-error .result-title {
            color: #f87171;
        }

        .result-subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
        }

        .info-value {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
        }

        .btn-download:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .error-message {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
        }

        .error-message strong {
            color: #f87171;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-wrapper input {
                font-size: 14px;
                padding: 14px 14px 14px 44px;
            }

            .btn-primary {
                font-size: 14px;
                padding: 14px;
            }

            #result {
                padding: 18px;
            }

            .info-row {
                flex-direction: column;
                gap: 4px;
                padding: 10px 12px;
            }

            .info-value {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo-wrapper">
                <img src="https://i.imgur.com/A7ey22t.png" alt="Logo" />
            </div>
            <h1>🎓 <span>Cek Kelulusan</span></h1>
            <p>Masukkan NISN untuk cek status kelulusan</p>
        </div>

        <div class="form-group">
            <label for="nisn">Nomor Induk Siswa Nasional</label>
            <div class="input-wrapper">
                <span class="icon">🔑</span>
                <input 
                    type="text" 
                    id="nisn" 
                    placeholder="Masukkan NISN Anda..." 
                    maxlength="20"
                    autocomplete="off"
                />
            </div>
        </div>

        <button class="btn-primary" onclick="cekKelulusan()" id="btnCek">
            🔍 Cek Sekarang
        </button>

        <div id="loading">
            <div class="spinner"></div>
            <p>Sedang memproses data...</p>
        </div>

        <div id="result"></div>

        <div class="footer">
            © 2024 SPMB • Sistem Pengumuman Kelulusan
        </div>
    </div>

    <script>
        // ⚠️ GANTI URL INI DENGAN URL WEB APP ANDA ⚠️
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwghM_HFcgQfT60fcg4GTMWlgs65UsG9qkcYeEMVt5nq7v6_sE8VuSQizvWYE4Vzvyc/exec";

        async function cekKelulusan() {
            const nisn = document.getElementById('nisn').value.trim();
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const btnCek = document.getElementById('btnCek');

            if (!nisn) {
                alert('❌ Masukkan NISN terlebih dahulu!');
                return;
            }

            if (nisn.length < 5) {
                alert('❌ NISN minimal 5 karakter!');
                return;
            }

            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            resultDiv.className = '';
            btnCek.disabled = true;
            btnCek.textContent = '⏳ Memproses...';

            try {
                const url = `${WEB_APP_URL}?action=cek&nisn=${encodeURIComponent(nisn)}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                loadingDiv.style.display = 'none';
                btnCek.disabled = false;
                btnCek.textContent = '🔍 Cek Sekarang';

                resultDiv.style.display = 'block';

                if (data.found) {
                    resultDiv.className = 'result-success';
                    resultDiv.innerHTML = `
                        <div class="result-icon">🎉</div>
                        <div class="result-title">Selamat! Anda Lulus</div>
                        <div class="result-subtitle">Berikut data kelulusan Anda:</div>
                        <div class="info-card">
                            <div class="info-row">
                                <span class="info-label">Nama Lengkap</span>
                                <span class="info-value">${data.nama || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">NISN</span>
                                <span class="info-value">${data.nisn || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Kelas</span>
                                <span class="info-value">${data.kelas || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Jenis Kelamin</span>
                                <span class="info-value">${data.jenisKelamin || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Tempat Lahir</span>
                                <span class="info-value">${data.tempatLahir || '-'}</span>
                            </div>
                        </div>
                        <button class="btn-download" onclick="downloadPDF('${nisn}')">
                            📄 Download Surat Keterangan Lulus
                        </button>
                    `;
                } else {
                    resultDiv.className = 'result-error';
                    resultDiv.innerHTML = `
                        <div class="result-icon">😔</div>
                        <div class="result-title">Data Tidak Ditemukan</div>
                        <div class="error-message">
                            NISN <strong>${nisn}</strong> tidak terdaftar di database kami.<br>
                            Silakan hubungi pihak sekolah untuk informasi lebih lanjut.
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.style.display = 'none';
                btnCek.disabled = false;
                btnCek.textContent = '🔍 Cek Sekarang';

                resultDiv.style.display = 'block';
                resultDiv.className = 'result-error';
                resultDiv.innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <div class="result-title">Terjadi Kesalahan</div>
                    <div class="error-message">
                        ${error.message}<br><br>
                        <small style="color: rgba(255,255,255,0.3); font-size: 12px;">
                            Pastikan URL Web App sudah benar dan aktif.
                        </small>
                    </div>
                `;
            }
        }

        // ============ DOWNLOAD PDF - DIPERBAIKI ============
        async function downloadPDF(nisn) {
            const btn = document.querySelector('.btn-download');
            const originalText = btn?.textContent || '📄 Download Surat Keterangan Lulus';
            
            try {
                if (btn) {
                    btn.textContent = '⏳ Mengunduh...';
                    btn.disabled = true;
                }

                const url = `${WEB_APP_URL}?action=download&nisn=${encodeURIComponent(nisn)}`;
                console.log('Download URL:', url);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Response data:', data);

                if (!data.success) {
                    throw new Error(data.error || 'Gagal download PDF');
                }

                // Decode Base64 ke binary
                const binaryString = atob(data.fileContent);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // Buat Blob dari binary
                const blob = new Blob([bytes], { type: 'application/pdf' });

                // Buat link download
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = data.fileName || `Surat_Keterangan_Lulus_${nisn}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                if (btn) {
                    btn.textContent = '✅ Berhasil!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 3000);
                }

            } catch (error) {
                console.error('Download error:', error);
                alert('❌ Gagal download PDF: ' + error.message);
                
                if (btn) {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            }
        }

        // Enter key
        document.getElementById('nisn').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') cekKelulusan();
        });
    </script>

</body>
</html>
